# .github/workflows/easyfilms-ci-cd.yaml

name: easyFilms CI/CD pipeline test

on:
  push:
    branches:
      - develop

env:
  IMAGE_NAME: easyfilms-test
  AWS_REGION: eu-north-1

jobs:
  build_backend:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to AWS ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.2.0

      - name: Build and push docker image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
          docker build -f backend/Dockerfile -t $IMAGE .
          docker push $IMAGE
  
  build_frontend:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to AWS ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.2.0

      - name: Build and push docker image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
          docker build -f frontend/Dockerfile -t $IMAGE .
          docker push $IMAGE
