# compose.yaml
# Local development environment for easyFilms:
#   - PostgreSQL 18 with pgvector (same major version as AWS RDS)
#   - Valkey 9 (Redis-compatible, same engine as AWS ElastiCache)

name: 'easyfilms'
services:
  db:
    # Data is stored in a named Docker volume (not in the project folder)
    image: pgvector/pgvector:0.8.7-pg18-trixie
    container_name: db-container-easyfilms
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_ADMIN}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 10s
    restart: unless-stopped
  
  redis:
    # No password locally: port is bound to localhost only.
    # Authentication will be enabled in AWS ElastiCache.
    image: valkey/valkey:9.2.1-alpine3.24
    container_name: redis-container-easyfilms
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 10s
    restart: unless-stopped

volumes:
  db_data: